# Manual production release of the proof of concept: migrate Neon, re-apply RLS, deploy to Makers.
# Needs repository secrets NEON_DATABASE_URL and EDGEONE_PAGES_API_TOKEN. Run from the Actions tab.
name: deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to migrate Neon and publish to Makers'
        required: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: inputs.confirm == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    defaults:
      run:
        working-directory: apps/platform
    env:
      NODE_OPTIONS: --no-deprecation
      PAYLOAD_DB_PUSH: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Migrate Neon, then re-apply RLS
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          export PAYLOAD_SECRET="$(openssl rand -hex 32)"   # migrations never sign tokens
          pnpm payload migrate
          pnpm exec tsx src/db/apply-rls.ts
      - name: Deploy to EdgeOne Makers (area overseas = Global, Chinese mainland excluded; finding 22)
        env:
          EDGEONE_PAGES_API_TOKEN: ${{ secrets.EDGEONE_PAGES_API_TOKEN }}
        run: |
          npm install -g edgeone@1.6.41
          rm -f .env .env.*   # runtime secrets live in Makers project variables, never in the upload
          node ../../scripts/vendor-packs.mjs   # Makers installs only this folder: copy packs/* in (CLAUDE.md 26)
          start=$(date +%s)
          edgeone makers deploy . -n hh-platform -a overseas -e production -t "$EDGEONE_PAGES_API_TOKEN" --json --skip-ai-gateway-sync
          echo "deploy took $(( $(date +%s) - start )) s"
