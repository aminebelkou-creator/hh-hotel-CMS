# Operated service (Phase 4): every night, the platform checks each live hotel site (links,
# photos, search text, freshness, facts, uptime) and runs axe on the live home pages; findings
# land as issues in each hotel's admin with a one-tap fix where there is one.
name: nightly

on:
  schedule:
    - cron: '17 3 * * *' # 05:17 Paris in summer, 04:17 in winter
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/platform
      - name: Checks and accessibility on every live site
        working-directory: apps/platform
        env:
          HEALTH_TOKEN: ${{ secrets.HEALTH_TOKEN }}
        run: node tests/quality/nightly.mjs https://hh-platform.edgeone.dev
