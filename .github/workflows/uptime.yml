# Uptime: every 30 minutes, the live platform and customer zero's site must answer quickly.
# A failure shows as a red run (and an email from GitHub to the repository owner).
name: uptime

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Platform admin login page and customer zero's home page
        run: |
          set -e
          for url in https://hh-platform.edgeone.dev/admin/login https://hh-platform.edgeone.dev/s/hotel-herse-dor; do
            start=$(date +%s%N)
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$url" || echo 000)
            ms=$(( ($(date +%s%N) - start) / 1000000 ))
            echo "$code ${ms}ms $url"
            if [ "$code" != "200" ]; then echo "::error::$url answered $code"; exit 1; fi
            if [ "$ms" -gt 8000 ]; then echo "::warning::$url took ${ms} ms"; fi
          done
